spring:
  application:
    name: gerenciador-prazos-processuais

  datasource:
    url: jdbc:postgresql://localhost:5432/attus_prazos
    username: attus
    password: attus123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    ai.attus.prazos: INFO
