services:
  postgres:
    image: postgres:16-alpine
    container_name: attus-prazos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attus_prazos
      POSTGRES_USER: attus
      POSTGRES_PASSWORD: attus123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attus -d attus_prazos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dados:
